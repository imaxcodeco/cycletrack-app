name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Run Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/

      - name: Upload Ktlint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  ui-tests:
    name: UI Tests (Instrumented)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          emulator: true
          arch: x86_64
          ndk-version: r26c

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-34;default;x86_64" --force
          $ANDROID_HOME/emulator/emulator -avd test -no-skin -no-audio -no-window -gpu swiftshader_indirect -no-boot-anim &

      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Run Instrumented Tests
        run: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/androidTest-results/

  build:
    name: Build Debug & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStoreFile: ${{ secrets.SIGNING_STORE_FILE }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'CycleTrack'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: '--failOnCVSS 7'

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check/

  deploy-internal:
    name: Deploy to Internal Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, ui-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: internal-testing

    steps:
      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: build/

      - name: Setup Google Play CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GOOGLE_PLAY_PROJECT_ID }}

      - name: Upload to Play Console Internal Testing
        run: |
          gcloud auth activate-service-account --key-file=${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          gcloud config set project ${{ secrets.GOOGLE_PLAY_PROJECT_ID }}
          
          # Upload bundle to internal testing track
          bundletool build-apks --bundle=build/app-release.aab \
            --output=build/app.apks \
            --ks=keystore.jks \
            --ks-pass=pass:${{ secrets.SIGNING_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }}

          # Use Play Console API to upload
          # This would typically use the Play Console publishing API

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'CycleTrack deploy to internal testing ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false