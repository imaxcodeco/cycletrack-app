# Gradle Configuration (memoria aumentada para DEX merging)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.compiler.execution.strategy=in-process

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false

# Build Performance
android.experimental.buildSpeedLogger.enable=false

# Compose Compiler
android.compose.compiler.version=1.5.11

# Detekt
detekt.failOnError=false
detekt.generateReport=true

# Realm
realm.sync.enabled=false

# Version Properties
app.version.code=1
app.version.name=1.0.0

# Feature Flags
feature.healthConnect.enabled=true
feature.partnerMode.enabled=true
feature.pregnancyMode.enabled=true
feature.perimenopauseMode.enabled=true
feature.anonymousMode.enabled=true
feature.export.enabled=true
feature.biometricAuth.enabled=true

# Analytics
analytics.enabled=true
analytics.debug=false

# Crashlytics
crashlytics.enabled=true
crashlytics.ndk.enabled=true

# Sentry
sentry.enabled=true
sentry.tracesSampleRate=0.1
sentry.profilesSampleRate=0.1

# Performance
performance.monitoring.enabled=true
